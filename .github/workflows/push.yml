# Dispara o envio das notificações no celular (api/cron-push) a cada 30 minutos.
# Configure em Settings > Secrets and variables > Actions:
#   CRON_URL    = https://appaceleraenem.vercel.app/api/cron-push
#   CRON_SECRET = o mesmo valor da variável CRON_SECRET na Vercel
# Sem os dois segredos, o workflow só avisa e termina sem erro (sem e-mail de falha).
name: Notificações push
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o servidor
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_URL e CRON_SECRET ainda não foram configurados nos Secrets. Nada a fazer."
            exit 0
          fi
          curl -fsS --max-time 60 "${CRON_URL}?token=${CRON_SECRET}"
